name: CI Pipeline

on: push

jobs:
  project-testing:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: setup python
        uses: actions/setup-python@v2
        with: 
          python-version: '3.10'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: install dependencies
        run: |
          pip install -r requirements.txt

      - name: run pipeline 
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: |
          dvc repro

      - name: Run model tests
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: |
          python -m unittest tests/test_model.py
      
      - name: Run Flask app tests
        if: success()
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python -m unittest tests/test_flask_app.py
      
      - name: Login to AWS ECR
        run: |
          aws configure set aws_access_key_id ${{secrets.AWS_ACCESS_KEY_ID}}
          aws configure set aws_secret_access_key ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 586345694515.dkr.ecr.us-east-1.amazonaws.com
      
      - name: Docker build image 
        run: |
          docker build -t hemant_mlops_ecr .
      
      - name: Tage docker image
        run: |
          docker tag hemant_mlops_ecr:latest 586345694515.dkr.ecr.us-east-1.amazonaws.com/hemant_mlops_ecr:latest

      - name: push docker image to AWS ECR
        run: |
          docker push 586345694515.dkr.ecr.us-east-1.amazonaws.com/hemant_mlops_ecr:latest

      - name: Deploy to EC2
        if: success()
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USER}}
          key: ${{secrets.EC2_SSH_KEY}}
          script: |
            aws configure set aws_access_key_id ${{secrets.AWS_ACCESS_KEY_ID}}
            aws configure set aws_secret_access_key ${{secrets.AWS_SECRET_ACCESS_KEY}}
            aws configure set default.region us-east-1
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 586345694515.dkr.ecr.us-east-1.amazonaws.com
            docker pull 586345694515.dkr.ecr.us-east-1.amazonaws.com/hemant_mlops_ecr:latest
            docker stop my-app || true
            docker rm my-app || true
            docker run -p 80:5000 -e DAGSHUB_PAT=be0c767d3c000cb25850a1a59a1718697b6a3955 --name hemantmlops-container 586345694515.dkr.ecr.us-east-1.amazonaws.com/hemant_mlops_ecr:latest
            